name: Monthly sourcing research
on:
  push:
    branches: [main]
    paths: ['automation/run-request.json']
  schedule:
    # Beijing 10:17, checkpoints for staggered monthly statistical releases.
    - cron: '17 2 5,18,25 * *'
  workflow_dispatch:
    inputs:
      month:
        description: '统计月份 YYYY-MM；留空为上一个完整月'
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: monthly-sourcing-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate pipeline
        run: python -m unittest discover -s automation/tests -v
      - name: Read run mode
        id: mode
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, 'automation')
          from monthly import target_month
          request = {}
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              with open('automation/run-request.json', encoding='utf-8') as f:
                  request = json.load(f)
          month = target_month(request.get('month'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('publish_existing=' + str(request.get('mode') == 'publish_existing').lower() + '\n')
              f.write('month=' + month + '\n')
          PY
      - name: Check configuration
        id: config
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
        run: |
          python - <<'PY'
          import os, sys
          sys.path.insert(0, 'automation')
          from monthly import configuration
          try:
              provider, _, model = configuration()
              ready = True
              print('Configured provider:', provider, 'model:', model)
          except ValueError as error:
              ready = False
              print(str(error))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('ready=' + str(ready).lower() + '\n')
          if not ready:
              with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
                  f.write('尚未启用付费AI调用：请配置对应服务商的API_KEY secret和MODEL variable，见配置步骤日志。\n')
              raise SystemExit('配置缺失，采集尚未启动；请核对仓库级变量。')
          PY
      - name: Preserve other categories for a single-category trial
        if: github.event_name == 'push' && steps.mode.outputs.publish_existing != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const request = JSON.parse(fs.readFileSync('automation/run-request.json','utf8'));
            if (!request.category) return;
            if (!['aluminum','copper','iron'].includes(request.category)) throw new Error('Invalid category');
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(request.month)) throw new Error('Invalid month');
            try {
              const response = await github.rest.repos.getContent({...context.repo,path:'data/ai-monthly.json',ref:'ai/monthly-' + request.month});
              const data = JSON.parse(Buffer.from(response.data.content,'base64').toString('utf8'));
              const report = data.reports[request.month];
              if (!report) return;
              fs.mkdirSync('automation/output',{recursive:true});
              fs.writeFileSync('automation/output/previous-draft.json',JSON.stringify(report,null,2));
            } catch(e) { if (e.status !== 404) throw e; }
      - name: Collect, validate and draft
        if: steps.config.outputs.ready == 'true' && steps.mode.outputs.publish_existing != 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          TARGET_MONTH: ${{ inputs.month }}
          TRIGGER_EVENT: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          month = os.environ.get('TARGET_MONTH', '')
          command = [sys.executable, '-u', 'automation/monthly.py']
          if os.environ['TRIGGER_EVENT'] == 'push':
              with open('automation/run-request.json', encoding='utf-8') as f:
                  request = json.load(f)
              month = request['month']
              if request.get('category'):
                  command += ['--category', request['category']]
          subprocess.run(command + ['--month', month], check=True)
          PY
      - name: Reuse existing reviewed-source draft
        if: steps.mode.outputs.publish_existing == 'true'
        uses: actions/github-script@v7
        env:
          REPORT_MONTH: ${{ steps.mode.outputs.month }}
        with:
          script: |
            const fs = require('fs');
            const month = process.env.REPORT_MONTH;
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(month)) throw new Error('Invalid month');
            const response = await github.rest.repos.getContent({...context.repo, path:'data/ai-monthly.json', ref:'ai/monthly-' + month});
            const content = Buffer.from(response.data.content, 'base64').toString('utf8');
            const data = JSON.parse(content), report = data.reports[month];
            if (!report) throw new Error('No existing report');
            fs.mkdirSync('automation/output', {recursive:true});
            fs.writeFileSync('data/ai-monthly.json', content);
            fs.writeFileSync('automation/output/draft.json', JSON.stringify(report, null, 2));
            fs.writeFileSync('automation/output/usage.json', JSON.stringify({mode:'publish_existing',modelRequests:0,searchRequests:0}));
      - name: Rebuild review text without model calls
        if: steps.mode.outputs.publish_existing == 'true'
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, 'automation')
          from monthly import markdown
          report = json.loads(Path('automation/output/draft.json').read_text(encoding='utf-8'))
          Path('automation/output/review.md').write_text(markdown(report), encoding='utf-8')
          PY
      - name: Keep review and usage records
        if: always() && steps.config.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: monthly-review-${{ github.run_number }}
          path: automation/output/
          if-no-files-found: ignore
          retention-days: 90
      - name: Open or update review draft
        if: steps.config.outputs.ready == 'true'
        uses: actions/github-script@v7
        env:
          PUBLISH_EXISTING: ${{ steps.mode.outputs.publish_existing }}
        with:
          script: |
            const fs = require('fs');
            const draft = JSON.parse(fs.readFileSync('automation/output/draft.json', 'utf8'));
            if (!/^\d{4}-(0[1-9]|1[0-2])$/.test(draft.month)) throw new Error('Invalid month');
            const owner = context.repo.owner, repo = context.repo.repo;
            const branch = 'ai/monthly-' + draft.month;
            const file = 'data/ai-monthly.json';
            const content = fs.readFileSync(file, 'utf8');
            const base = context.payload.repository.default_branch;
            let parent;
            try {
              parent = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + branch})).data.object.sha;
              const old = await github.rest.repos.getContent({owner, repo, path: file, ref: branch});
              const oldJson = JSON.parse(Buffer.from(old.data.content, 'base64').toString('utf8'));
              const next = JSON.parse(content);
              // A retry with identical evidence needs no model-text-only update.
              const hashes = j => JSON.stringify(Object.fromEntries(Object.entries(j.reports[draft.month]?.categories || {}).map(([k,v]) => [k, v.sourceHashes])));
              if (hashes(oldJson) === hashes(next) && process.env.PUBLISH_EXISTING !== 'true') { core.notice('No new source evidence; keeping existing draft.'); return; }
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            const head = (await github.rest.git.getRef({owner, repo, ref: 'heads/' + base})).data.object.sha;
            const tree = await github.rest.git.createTree({owner, repo, base_tree: head, tree: [{path: file, mode:'100644', type:'blob', content}]});
            const commit = await github.rest.git.createCommit({owner, repo, message:'Draft sourcing research ' + draft.month, tree: tree.data.sha, parents:parent && parent !== head ? [parent, head] : [head]});
            if (parent) await github.rest.git.updateRef({owner, repo, ref:'heads/' + branch, sha:commit.data.sha, force:false});
            else await github.rest.git.createRef({owner, repo, ref:'refs/heads/' + branch, sha:commit.data.sha});
            const body = fs.readFileSync('automation/output/review.md', 'utf8') + '\n\n运行记录与用量见本次 Actions artifacts。请核验后将草稿标为可审核并合并；合并后工作台展示本月研究。';
            const existing = await github.rest.pulls.list({owner, repo, head:owner + ':' + branch, state:'open'});
            if (existing.data.length) await github.rest.pulls.update({owner, repo, pull_number:existing.data[0].number, body});
            else await github.rest.pulls.create({owner, repo, head:branch, base, title:draft.month + ' 原材料月报与采购行动（待审核）', body, draft:true});
            core.summary.addRaw('月报草稿已提交。合并前不会改变正式页面。').write();
